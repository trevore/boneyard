# Overrides merged into the nerd-font-symbols preset by install.sh. Tables only (no top-level keys).

[aws]
format = '[$symbol($profile )(\($region\) )]($style)'

[directory]
truncation_length = 0
truncate_to_repo = false

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '

[status]
disabled = false

[sudo]
disabled = false
