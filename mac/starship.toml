# Overrides on top of starship's defaults

[aws]
format = '[$symbol($profile )(\($region\) )]($style)'

[directory]
truncation_length = 0
truncate_to_repo = false

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '

[status]
disabled = false

[sudo]
disabled = false
